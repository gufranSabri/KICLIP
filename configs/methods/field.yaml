# structured field (main method, run field_both_t2): every vision block's CLS, dropout-pooled, feeds an open-vocabulary
# field embedder trained on the base labels plus frozen CLIP's softened class distribution; its output is also added
# to the FINAL video embedding, not mid-stack, where downstream pretrained biases would erase it (see field.py)
model:
  field_enabled: true
  field_source: student # student | teacher | both
  field_segments: 64 # pooled feature-dim size (M); the width must be divisible by this
  field_pool_modes: [dropout] # resampled once per training step from mean|max|dropout; eval always uses mean
  field_dropout_p: 0.3 # dropout pool mode only: fraction of each segment dropped before the survivor mean
  field_alpha: 0.5 # frames = frames + field_alpha * field_embed(field); only the last bias is zero-init, so not an exact no-op
  field_ce_weight: 1.0 # weight of the field loss in the total loss
  field_lr: 3.33e-4 # separate LR for field_embed params
  field_target: both # field loss target: label = CE on base labels | teacher = KL to frozen CLIP's class distribution | both
  field_tau: 2.0 # softmax temperature of the teacher target (KL scaled by tau^2)
