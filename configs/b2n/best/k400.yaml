# best b2n config for k400: HM 72.45 from runs/ceweight_sweep/k400_w0.1 (generated by scripts/pick_best_config.py)
model:
  drift_damping_weight: [0.5, 0.5]
  cgas_enabled: true
  cgas_source: student
  cgas_segments: 64
  cgas_pool_modes: [dropout]
  cgas_dropout_p: 0.3
  cgas_ce_weight: 0.1
  cgas_lr: 0.000333
  cgas_target: both
  cgas_tau: 2.0
  cgas_layers: all
  cgas_detach: false
  cgas_clip_separate: false
  cgas_grad_log: false
  vision_dropout: 0.0
data:
  train: b2n/k400/train_s1
  val: b2n/k400/base
  test: [b2n/k400/base, b2n/k400/novel]
  train_fraction: 1.0
train: {epochs: 12}
