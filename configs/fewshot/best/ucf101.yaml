# fewshot config for ucf101: model hyperparameters from the b2n best run (HM 88.96, runs/ceweight_sweep/ucf101_w0.1); data from configs/fewshot/default/ucf101.yaml (generated by scripts/pick_best_config.py)
model:
  drift_damping_weight: [0.5, 0.5]
  cgas_enabled: true
  cgas_source: student
  cgas_segments: 64
  cgas_pool_modes: [dropout]
  cgas_dropout_p: 0.3
  cgas_ce_weight: 0.1
  cgas_lr: 0.000333
  cgas_target: both
  cgas_tau: 2.0
  cgas_layers: all
  cgas_detach: false
  cgas_clip_separate: false
  cgas_grad_log: false
  vision_dropout: 0.0
data:
  train: fewshot/ucf101/train_k16
  val: fewshot/ucf101/val1
  test: [fewshot/ucf101/val1]
train: {epochs: 12, batch_size: 4, eval_every: 0}
