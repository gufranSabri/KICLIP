# few-shot UCF101: all 101 classes, K training clips per class (ViFi-CLIP's split1 few-shot files, the
# standard OST/MoTE/MSTA reuse); data.train set per-K by scripts/run_fewshot.sh. Test is val1, all 101 classes.
data:
  train: fewshot/ucf101/train_k16
  val: fewshot/ucf101/val1
  test: [fewshot/ucf101/val1]

train:
  epochs: 12
  batch_size: 4 # reference/KICLIP's TRAIN.BATCH_SIZE, no gradient accumulation
  eval_every: 0
